{% extends "base.html" %}

{% block title %}Edit {{ book['title'] }} - Audible Downloader{% endblock %}

{% block content %}
<div class="card">
    <h2 style="margin-bottom: 20px;">Edit Audiobook</h2>

    <form method="post" action="{{ url_for('edit_book', asin=book['asin']) }}">
        <div class="form-group">
            <label for="title">Title *</label>
            <input type="text" id="title" name="title" value="{{ book['title'] }}" required>
        </div>

        <div class="form-group">
            <label for="subtitle">Subtitle</label>
            <input type="text" id="subtitle" name="subtitle" value="{{ book['subtitle'] or '' }}">
        </div>

        <div class="form-group">
            <label for="authors">Author(s) *</label>
            <input type="text" id="authors" name="authors" value="{{ book['authors'] }}" required>
        </div>

        <div class="form-group">
            <label for="series_title">Series Title</label>
            <input type="text" id="series_title" name="series_title" value="{{ book['series_title'] or '' }}">
        </div>

        <div class="form-group">
            <label for="series_sequence">Series Sequence</label>
            <input type="number" id="series_sequence" name="series_sequence" value="{{ book['series_sequence'] or '' }}">
        </div>

        <div class="form-group">
            <label for="narrators">Narrator(s)</label>
            <input type="text" id="narrators" name="narrators" value="{{ book['narrators'] or '' }}">
        </div>

        <div class="form-group">
            <label for="release_date">Release Date</label>
            <input type="text" id="release_date" name="release_date" value="{{ book['release_date'] or '' }}" placeholder="YYYY-MM-DD">
        </div>

        <div class="form-group">
            <label>ASIN (Read-only)</label>
            <input type="text" value="{{ book['asin'] }}" disabled style="background-color: #ecf0f1;">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-success">Save Changes</button>
            <a href="{{ url_for('book_detail', asin=book['asin']) }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
